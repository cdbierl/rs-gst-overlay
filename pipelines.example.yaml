presets:
  - name: Test Pattern
    pipeline: >-
      videotestsrc is-live=true ! videoconvert ! video/x-raw,format=RGBA ! appsink name=video_sink
  - name: Amcrest Camera
    pipeline: >-
      rtspsrc location=rtsp://camera.example:554/stream latency=100 !
      queue ! rtph264depay ! h264parse ! avdec_h264 ! videoconvert !
      video/x-raw,format=RGBA ! appsink name=video_sink
